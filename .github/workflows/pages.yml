name: Publish Misi Bintang Bacaan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install supplied game graphics
        run: |
          test -f GRAFIK-PERMAINAN-TERKINI.zip
          unzip -oq GRAFIK-PERMAINAN-TERKINI.zip 'assets/*' -d .
          test -s assets/03-map-v2.png
          test -s assets/10-win1-v2.png
          test -s assets/17-win2-v2.png
          echo "All 3 updated game graphics are ready."
      - name: Generate Malay proverb narration MP3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          mkdir -p audio
          espeak -v ms -s 120 -p 50 -w /tmp/m1.wav "Masa itu emas"
          espeak -v ms -s 120 -p 50 -w /tmp/m2.wav "Berganding bahu"
          espeak -v ms -s 115 -p 50 -w /tmp/m3.wav "Tak lapuk dek hujan, tak lekang dek panas"
          for n in 1 2 3; do ffmpeg -loglevel error -y -i "/tmp/m$n.wav" -codec:a libmp3lame -qscale:a 4 "audio/m$n-peribahasa.mp3"; done
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
