<script>
"use strict";
const $=id=>document.getElementById(id);
const assets=Array.from({length:27},(_,i)=>String(i+1).padStart(2,"0")+".png");
const fallback=["https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/latar-pengembaraan.png.png","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/assets-tahap1-masa-itu-emas.png","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/latar-pengembaraan.png.png","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/assets-tahap3-warisan.png.png"];
const missions=[
 {title:"Masa itu emas",world:"Istana Masa Emas",meaning:"Masa sangat berharga dan perlu digunakan dengan sebaik-baiknya.",texts:["Masa itu emas","Aiman menyiapkan kerja sekolahnya dengan segera kerana dia tahu bahawa masa itu emas.","Siti menggunakan masa lapangnya untuk membaca buku kerana dia percaya bahawa masa itu emas."],audio:[null,"https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t1-ayat1.mp3.mp3","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t1-ayat2.mp3.mp3"],questions:[
 {q:"Apakah maksud peribahasa masa itu emas?",a:["Masa perlu digunakan dengan sebaik-baiknya.","Masa sentiasa berjalan dengan perlahan.","Emas boleh dibeli menggunakan masa."],right:0},
 {q:"Susun perkataan menjadi ayat yang gramatis.",sort:["Siti","menggunakan","masa","lapangnya","untuk","membaca","buku."],right:0}]},
 {title:"Berganding bahu",world:"Kampung Kerjasama",meaning:"Bekerjasama untuk melakukan sesuatu pekerjaan atau mencapai sesuatu tujuan.",texts:["Berganding bahu","Murid-murid Tahun 4 berganding bahu membersihkan kelas supaya persekitaran sekolah sentiasa bersih.","Penduduk kampung berganding bahu membantu mangsa banjir dengan mengumpulkan makanan dan pakaian."],audio:[null,"https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t2-ayat1.mp3.mp3","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t2-ayat2.mp3.mp3"],questions:[
 {q:"Situasi manakah menunjukkan amalan berganding bahu?",a:["Murid bekerjasama membersihkan kelas.","Seorang murid tidur ketika kerja berkumpulan.","Ali bermain sendirian tanpa membantu."],right:0},
 {q:"Apakah tindakan penduduk kampung untuk membantu mangsa banjir?",a:["Pergi bercuti bersama-sama.","Mengumpulkan makanan dan pakaian.","Menjual makanan di pasar malam."],right:1}]},
 {title:"Tak lapuk dek hujan, tak lekang dek panas",world:"Khazanah Warisan",meaning:"Sesuatu yang kekal sepanjang zaman dan tidak dilupakan walaupun zaman berubah.",texts:["Tak lapuk dek hujan, tak lekang dek panas","Permainan congkak masih popular hingga kini kerana warisan ini tak lapuk dek hujan, tak lekang dek panas.","Siti mempelajari tarian zapin daripada neneknya supaya seni tradisional itu tak lapuk dek hujan, tak lekang dek panas."],audio:[null,"https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t3-ayat1.mp3.mp3","https://raw.githubusercontent.com/aisyah-bot/MISI-BINTANG-BAHASA/main/t3-ayat2.mp3.mp3"],questions:[
 {q:"Apakah maksud peribahasa tak lapuk dek hujan, tak lekang dek panas?",a:["Sesuatu yang mudah rosak apabila lama disimpan.","Sesuatu yang kekal dan tidak dilupakan walaupun zaman berubah.","Sesuatu yang hanya digemari oleh golongan tua."],right:1},
 {q:"Tindakan manakah menunjukkan usaha mengekalkan warisan budaya?",a:["Siti mempelajari tarian zapin daripada neneknya.","Ali membuang congkak lama di stor.","Ravi tidak mahu belajar seni tradisional."],right:0}]}];
const screens={home:0,how:1,map:2,intro:[3,10,17],read:[[4,5,6],[11,12,13],[18,19,20]],quiz:[[7,8],[14,15],[21,22]],win:[9,16,23],finish:24,certificate:25,teacher:26};
const key="misi-bintang-v2";const safeParse=(v,d)=>{try{return JSON.parse(v)||d}catch{return d}};
let students=safeParse(localStorage.getItem(key),{}),name=localStorage.getItem(key+"name")||"",screen="home",mi=0,ri=0,qi=0,chosen=-1,sortList=[],audio=null,recorder=null,chunks=[],recordings={},working=false;
const save=()=>{localStorage.setItem(key,JSON.stringify(students));localStorage.setItem(key+"name",name)};
const blank=()=>({finished:[false,false,false],reads:[[false,false,false],[false,false,false],[false,false,false]],quiz:[[false,false],[false,false],[false,false]],stars:[0,0,0],marks:{},recordCount:0});
function entry(){if(!students[name])students[name]=blank();return students[name]}
function openScreen(s,m=mi,r=ri,q=qi){if(recorder&&recorder.state==="recording")recorder.stop();stopAudio();screen=s;mi=m;ri=r;qi=q;chosen=-1;sortList=[];render()}
function bgIndex(){if(screen==="home")return 0;if(screen==="how")return 1;if(screen==="map")return 2;if(screen==="teacher")return 26;if(screen==="finish")return 24;if(screen==="certificate")return 25;if(screen==="intro")return screens.intro[mi];if(screen==="read")return screens.read[mi][ri];if(screen==="quiz")return screens.quiz[mi][qi];if(screen==="win")return screens.win[mi];return 0}
function stopAudio(){if(audio){audio.pause();audio=null}if("speechSynthesis" in window)speechSynthesis.cancel()}
function setBg(i){const scene=$("scene");const img=new Image();img.onload=()=>{if(bgIndex()===i)scene.style.backgroundImage='url("'+assets[i]+'")'};img.onerror=()=>{if(bgIndex()===i)scene.style.backgroundImage='url("'+fallback[i>=17?"3":i>=10?"2":i>=3?"1":"0"]+'")'};img.src=assets[i]}
function btn(text,fn,cls="",disabled=false){const b=document.createElement("button");b.className="btn "+cls;b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}
function block(title,body){$("stage").innerHTML='<div class="panel"><h1 id="pt"></h1><div id="pb"></div><div class="buttons" id="act"></div></div>';$("pt").textContent=title;$("pb").innerHTML=body;return $("act")}
function add(el,label,fn,cls="",disabled=false){el.append(btn(label,fn,cls,disabled))}
function enter(){let n=$("nameInput").value.trim().replace(/[<>]/g,"").slice(0,60);if(!n){$("status").textContent="Masukkan nama terlebih dahulu.";return}name=n;entry();save();openScreen("map",0)}
function render(){setBg(bgIndex());if(screen==="home"){let a=block("MISI BINTANG BACAAN",'<p>Pengembaraan Peribahasa · Bahasa Melayu Tahun 4</p><p>Masukkan nama murid untuk memulakan perjalanan tiga dunia.</p><input id="nameInput" class="field" maxlength="60" aria-label="Masukkan nama murid" placeholder="Contoh: Aisyah"><div id="status" class="status"></div>');$("nameInput").value=name;add(a,"▶ MULA PENGEMBARAAN",enter,"green");add(a,"📖 CARA BERMAIN",()=>openScreen("how"));add(a,"🏆 PENCAPAIAN",()=>{if(!name)return alert("Masukkan nama dahulu.");openScreen("finish")});$("nameInput").onkeydown=e=>{if(e.key==="Enter")enter()};return}
 if(screen==="how"){const a=block("CARA BERMAIN",'<ol class="guide"><li>Masukkan nama murid.</li><li>Pilih misi yang telah dibuka.</li><li>Dengar contoh bacaan.</li><li>Rakam bacaan peribahasa, ayat 1 dan ayat 2.</li><li>Jawab kedua-dua cabaran kefahaman.</li><li>Kumpulkan bintang dan buka misi berikutnya.</li></ol>');add(a,"🏠 UTAMA",()=>openScreen("home"));add(a,"🗺 PETA MISI",()=>name?openScreen("map"):openScreen("home"),"green");return}
 if(screen==="map"){const e=entry();let a=block("PETA PENGEMBARAAN",'<p>Selamat datang, <b id="nm"></b>! Pilih misi mengikut urutan.</p><div id="mapCards" class="cards"></div><p id="total" class="score"></p>');$("nm").textContent=name;const mc=$("mapCards");missions.forEach((m,i)=>{const ok=i===0||e.finished[i-1],done=e.finished[i];const c=document.createElement("button");c.className="cardChoice";c.disabled=!ok;c.innerHTML='<strong>MISI '+(i+1)+'</strong><br>'+m.title+'<br><br>'+(done?"⭐ Selesai · "+e.stars[i]+" bintang":ok?"▶ Mula Misi":"🔒 Terkunci");c.onclick=()=>openScreen("intro",i);mc.append(c)});$("total").textContent="Jumlah bintang: "+e.stars.reduce((a,b)=>a+b,0)+" / 9";add(a,"🏠 UTAMA",()=>openScreen("home"));if(e.finished.every(Boolean))add(a,"🏅 LIHAT SIJIL",()=>openScreen("certificate"),"gold");return}
 if(screen==="intro"){const m=missions[mi],a=block("MISI "+(mi+1)+" — "+m.title,'<p><b>'+m.world+'</b></p><p><strong>Maksud:</strong> '+m.meaning+'</p><p>⭐ 1. Baca peribahasa<br>⭐ 2. Baca ayat 1<br>⭐ 3. Baca ayat 2</p>');add(a,"📖 MULA AKTIVITI BACAAN",()=>openScreen("read",mi,0),"green");add(a,"🗺 PETA",()=>openScreen("map"));return}
 if(screen==="read"){const m=missions[mi],e=entry(),label=ri===0?"BACA PERIBAHASA":"BACA AYAT "+ri,a=block("MISI "+(mi+1)+" · "+label+' ('+(ri+1)+'/3)', '<p class="narration" id="readText"></p><p class="notice">Dengar contoh bacaan dahulu, kemudian rakam bacaan sendiri.</p><p id="rstatus" class="status"></p><div id="player"></div>');$("readText").textContent=m.texts[ri];add(a,"🔊 DENGAR CONTOH",()=>playSample());add(a,"↻ ULANG AUDIO",()=>playSample());add(a,"🎙 MULA RAKAMAN",()=>startRecord(),"red");add(a,"■ HENTIKAN",()=>stopRecord());add(a,"▶ DENGAR RAKAMAN",()=>playRecording());add(a,"✓ SEMAK BACAAN",()=>markRead());add(a,"➡ SETERUSNYA",()=>{if(!e.reads[mi][ri])return alert("Rakam bacaan atau gunakan pilihan Semak Bacaan untuk meneruskan.");if(ri<2)openScreen("read",mi,ri+1);else openScreen("quiz",mi,0,0)},"green",!e.reads[mi][ri]);return}
 if(screen==="quiz"){const m=missions[mi],q=m.questions[qi],a=block("MISI "+(mi+1)+" · CABARAN KEFAHAMAN "+(qi+1),'<p class="narration" id="question"></p><div class="cards" id="options"></div><p class="status" id="qstatus"></p>');$("question").textContent=q.q;const o=$("options");if(q.sort){const p=document.createElement("p");p.textContent="Ayat disusun: ";p.id="built";o.before(p);q.sort.slice().sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement("button");b.className="cardChoice";b.textContent=w;b.onclick=()=>{sortList.push(w);b.disabled=true;$("built").textContent=sortList.join(" ")};o.append(b)});add(a,"↺ SUSUN SEMULA",()=>openScreen("quiz",mi,0,qi));}else q.a.forEach((t,i)=>{let b=document.createElement("button");b.className="cardChoice";b.textContent=String.fromCharCode(65+i)+". "+t;b.onclick=()=>{chosen=i;[...o.children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")};o.append(b)});add(a,"✓ SEMAK JAWAPAN",()=>{const correct=q.sort?sortList.join(" ")===q.sort.join(" "):chosen===q.right;if((q.sort&&!sortList.length)||(!q.sort&&chosen<0))return alert("Sila pilih jawapan dahulu.");$("qstatus").textContent=correct?"Betul! Syabas!":"Cuba lagi. Baca soalan dengan teliti.";if(correct){entry().quiz[mi][qi]=true;save();render()}},"green");if(entry().quiz[mi][qi])add(a,qi===0?"➡ CABARAN 2":"🏁 SELESAI MISI",()=>{if(qi===0)openScreen("quiz",mi,0,1);else finishMission()},"gold");add(a,"↩ KEMBALI",()=>openScreen("read",mi,2));return}
 if(screen==="win"){let m=missions[mi],e=entry(),a=block("⭐ MISI "+(mi+1)+" BERJAYA!",'<p>Syabas, <b id="winner"></b>!</p><p class="stars">⭐'.repeat(e.stars[mi])+'☆'.repeat(3-e.stars[mi])+'</p><p>'+m.title+'</p><p>'+(mi<2?"Misi "+(mi+2)+" kini dibuka!":"Semua misi telah selesai!")+'</p>');$("winner").textContent=name;add(a,"🗺 KEMBALI KE PETA",()=>openScreen("map"),"green");if(mi===2)add(a,"🏅 LIHAT SIJIL",()=>openScreen("certificate"),"gold");return}
 if(screen==="finish"){let e=name?entry():blank(),a=block("PENCAPAIAN MURID",'<p id="pname"></p><p class="stars">'+e.stars.map(n=>"⭐".repeat(n)+"☆".repeat(3-n)).join(" | ")+'</p><p>Misi selesai: '+e.finished.filter(Boolean).length+'/3 · Jumlah bintang: '+e.stars.reduce((a,b)=>a+b,0)+'/9</p>');$("pname").textContent=name||"Tiada murid dipilih";add(a,"🗺 PETA",()=>openScreen("map"),"green");if(e.finished.every(Boolean))add(a,"🏅 SIJIL",()=>openScreen("certificate"));return}
 if(screen==="certificate"){let e=entry();if(!e.finished.every(Boolean))return openScreen("map");const a=block("🏅 SIJIL PENCAPAIAN",'<p>Sijil ini dianugerahkan kepada</p><p class="narration" id="certname"></p><p>kerana berjaya menyelesaikan ketiga-tiga Misi Bintang Bacaan.</p><p class="stars">⭐⭐⭐</p><p>Bahasa Melayu Tahun 4</p>');$("certname").textContent=name;add(a,"🖨 CETAK SIJIL",()=>window.print(),"green");add(a,"🏠 UTAMA",()=>openScreen("home"));return}
 if(screen==="teacher")renderTeacher();
}

   add("✓ Semak Jawapan",()=>{const target=[...v3stage.querySelectorAll(".hot")].find(x=>x.getAttribute("aria-label")==="Semak jawapan");if(!target)return alert("Sila pilih jawapan.");target.click()},true);
   add("Cuba Semula",()=>openScreen("quiz",mi,0,qi));
   add("Peta",()=>openScreen("map"));
 }else if(screen==="win"){
   add("➡ Kembali ke Peta",()=>openScreen("map"),true);
 }else if(screen==="finish"){
   add("Peta Misi",()=>openScreen("map"),true);
   add("Sijil Pencapaian",()=>e.finished.every(Boolean)?openScreen("certificate"):alert("Selesaikan ketiga-tiga misi terlebih dahulu."),false,!e.finished.every(Boolean));
 }else if(screen==="certificate"){
   add("🖨 Cetak Sijil",()=>window.print(),true);add("Utama",()=>openScreen("home"));
 }else if(screen==="teacher"){
   add("Utama",()=>openScreen("home"),true);
 }
}
render=v3OriginalRender;


render();
</script></body></html>
